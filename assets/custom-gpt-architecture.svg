<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">What Makes Up a Custom AI Assistant (GPT)</text>

  <rect x="350" y="140" width="200" height="70" rx="10" fill="#1F3864"/>
  <text x="450" y="180" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">Base Model</text>
  <text x="450" y="198" text-anchor="middle" font-size="11" fill="#DCE6F2">(general-purpose LLM)</text>

  <g>
    <rect x="60" y="60" width="200" height="60" rx="8" fill="#2E75B6"/>
    <text x="160" y="85" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Instructions</text>
    <text x="160" y="103" text-anchor="middle" font-size="10" fill="#EAF1F8">role, tone, behavior rules</text>
    <line x1="260" y1="100" x2="350" y2="160" stroke="#2E75B6" stroke-width="2"/>
  </g>

  <g>
    <rect x="60" y="240" width="200" height="60" rx="8" fill="#2E75B6"/>
    <text x="160" y="265" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Knowledge</text>
    <text x="160" y="283" text-anchor="middle" font-size="10" fill="#EAF1F8">uploaded reference files</text>
    <line x1="260" y1="255" x2="350" y2="195" stroke="#2E75B6" stroke-width="2"/>
  </g>

  <g>
    <rect x="640" y="60" width="200" height="60" rx="8" fill="#2E75B6"/>
    <text x="740" y="85" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Capabilities</text>
    <text x="740" y="103" text-anchor="middle" font-size="10" fill="#EAF1F8">web search, code, images</text>
    <line x1="640" y1="100" x2="550" y2="160" stroke="#2E75B6" stroke-width="2"/>
  </g>

  <g>
    <rect x="640" y="240" width="200" height="60" rx="8" fill="#2E75B6"/>
    <text x="740" y="265" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Actions</text>
    <text x="740" y="283" text-anchor="middle" font-size="10" fill="#EAF1F8">calls to external APIs</text>
    <line x1="640" y1="255" x2="550" y2="195" stroke="#2E75B6" stroke-width="2"/>
  </g>
</svg>
