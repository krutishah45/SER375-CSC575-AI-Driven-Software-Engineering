<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">Anatomy of an Effective Prompt</text>

  <!-- central prompt box -->
  <rect x="330" y="170" width="240" height="80" rx="10" fill="#1F3864"/>
  <text x="450" y="205" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold">Your Prompt</text>
  <text x="450" y="228" text-anchor="middle" font-size="12" fill="#DCE6F2">sent to the AI model</text>

  <!-- 5 surrounding components -->
  <!-- Role -->
  <g>
    <rect x="40" y="60" width="180" height="70" rx="8" fill="#2E75B6"/>
    <text x="130" y="88" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">1. Role / Persona</text>
    <text x="130" y="108" text-anchor="middle" font-size="11" fill="#EAF1F8">"Act as a senior QA engineer"</text>
    <line x1="220" y1="110" x2="330" y2="185" stroke="#2E75B6" stroke-width="2"/>
  </g>

  <!-- Context -->
  <g>
    <rect x="680" y="60" width="180" height="70" rx="8" fill="#2E75B6"/>
    <text x="770" y="88" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">2. Context</text>
    <text x="770" y="108" text-anchor="middle" font-size="11" fill="#EAF1F8">relevant code, requirements</text>
    <line x1="680" y1="110" x2="570" y2="185" stroke="#2E75B6" stroke-width="2"/>
  </g>

  <!-- Task -->
  <g>
    <rect x="40" y="330" width="180" height="70" rx="8" fill="#2E75B6"/>
    <text x="130" y="358" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">3. Task</text>
    <text x="130" y="378" text-anchor="middle" font-size="11" fill="#EAF1F8">one specific, clear action</text>
    <line x1="220" y1="340" x2="330" y2="235" stroke="#2E75B6" stroke-width="2"/>
  </g>

  <!-- Format -->
  <g>
    <rect x="680" y="330" width="180" height="70" rx="8" fill="#2E75B6"/>
    <text x="770" y="358" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">4. Format</text>
    <text x="770" y="378" text-anchor="middle" font-size="11" fill="#EAF1F8">"return a numbered list"</text>
    <line x1="680" y1="340" x2="570" y2="235" stroke="#2E75B6" stroke-width="2"/>
  </g>

  <!-- Constraints -->
  <g>
    <rect x="360" y="330" width="180" height="70" rx="8" fill="#2E75B6"/>
    <text x="450" y="358" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">5. Constraints</text>
    <text x="450" y="378" text-anchor="middle" font-size="11" fill="#EAF1F8">"keep function under 40 lines"</text>
    <line x1="450" y1="330" x2="450" y2="250" stroke="#2E75B6" stroke-width="2"/>
  </g>
</svg>
