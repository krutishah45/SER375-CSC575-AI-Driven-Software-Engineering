<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F3864">Which AI Tool Do I Reach For?</text>

  <!-- Start -->
  <rect x="410" y="55" width="180" height="50" rx="8" fill="#1F3864"/>
  <text x="500" y="85" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">What's the task?</text>

  <!-- branch lines -->
  <line x1="500" y1="105" x2="180" y2="150" stroke="#888" stroke-width="1.5"/>
  <line x1="500" y1="105" x2="500" y2="150" stroke="#888" stroke-width="1.5"/>
  <line x1="500" y1="105" x2="820" y2="150" stroke="#888" stroke-width="1.5"/>

  <!-- Branch 1: one-off question -->
  <rect x="60" y="150" width="240" height="55" rx="8" fill="#2E75B6"/>
  <text x="180" y="172" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">One-off question or draft</text>
  <text x="180" y="190" text-anchor="middle" font-size="10" fill="#EAF1F8">(e.g. explain a concept, quick rewrite)</text>
  <line x1="180" y1="205" x2="180" y2="240" stroke="#888" stroke-width="1.5"/>
  <rect x="80" y="240" width="200" height="45" rx="8" fill="#4C8BC9"/>
  <text x="180" y="267" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">→ Plain chat prompt</text>
  <text x="180" y="305" text-anchor="middle" font-size="10" fill="#555">Guide 1</text>

  <!-- Branch 2: repeatable task -->
  <rect x="380" y="150" width="240" height="55" rx="8" fill="#2E75B6"/>
  <text x="500" y="172" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Repeatable task, same style</text>
  <text x="500" y="190" text-anchor="middle" font-size="10" fill="#EAF1F8">every time, maybe shared with a team</text>
  <line x1="500" y1="205" x2="500" y2="240" stroke="#888" stroke-width="1.5"/>
  <rect x="400" y="240" width="200" height="45" rx="8" fill="#4C8BC9"/>
  <text x="500" y="267" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">→ Custom GPT / assistant</text>
  <text x="500" y="305" text-anchor="middle" font-size="10" fill="#555">Guide 3</text>

  <!-- Branch 3: touches real code/files -->
  <rect x="700" y="150" width="260" height="55" rx="8" fill="#2E75B6"/>
  <text x="830" y="172" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Needs to read/edit real files,</text>
  <text x="830" y="190" text-anchor="middle" font-size="10" fill="#EAF1F8">run commands, or use your codebase</text>
  <line x1="830" y1="205" x2="830" y2="240" stroke="#888" stroke-width="1.5"/>

  <rect x="710" y="240" width="240" height="55" rx="8" fill="#4C8BC9"/>
  <text x="830" y="262" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Can the steps be fixed</text>
  <text x="830" y="280" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">in advance?</text>

  <line x1="770" y1="295" x2="710" y2="340" stroke="#888" stroke-width="1.5"/>
  <line x1="890" y1="295" x2="930" y2="340" stroke="#888" stroke-width="1.5"/>

  <rect x="600" y="340" width="220" height="60" rx="8" fill="#C0392B"/>
  <text x="710" y="365" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Yes → scripted workflow</text>
  <text x="710" y="384" text-anchor="middle" font-size="10" fill="#F5D5D0">(automation, not an agent)</text>

  <rect x="840" y="340" width="150" height="60" rx="8" fill="#C0392B"/>
  <text x="915" y="358" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">No → agentic</text>
  <text x="915" y="374" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">coding tool</text>
  <text x="915" y="390" text-anchor="middle" font-size="9" fill="#F5D5D0">e.g. Claude Code</text>

  <text x="500" y="450" text-anchor="middle" font-size="11" fill="#666">See Guide 2 for the full workflow-vs-agent distinction and Guide 4 for Claude Code specifically.</text>
</svg>
